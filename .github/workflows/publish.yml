# =============================================================================
# GitHub Actions Workflow: Build and Publish routeros-lsp to PyPI
# =============================================================================
#
# Purpose:
#   Builds, tests and publishes the Python package to PyPI whenever a change to
#   a shipped file lands on master. GitVersion computes the version from the
#   Conventional Commit messages; a git tag and a GitHub release follow.
#
# Version format: MAJOR.MINOR.PATCH (one string for the package, the tag and the release)
#   feat:   bumps MINOR  ->  0.x.0
#   fix:    bumps PATCH  ->  0.0.x   (also chore, refactor, perf, build, ci, test)
#   docs:   no bump
#
# Workflow steps:
#   1. version:  calculate the version with GitVersion
#   2. build:    build the wheel and sdist with that version, check them, install the
#                wheel in a clean environment and start the server over real stdio
#   3. test:     run the test suite on Python 3.10 to 3.13
#   4. publish:  upload to PyPI with trusted publishing (no token is stored anywhere)
#   5. release:  push the tag vX.Y.Z and create the GitHub release
#
# Requirements:
#   - GitVersion.yml in the repository root
#   - A PyPI trusted publisher for project routeros-lsp: owner wiresage, repository
#     routeros-lsp, workflow publish.yml, environment pypi (see docs/releasing.md)
#   - A GitHub environment named pypi
#
# =============================================================================
name: Build and Publish to PyPI

on:
  push:
    branches:
      - master
    # Deployment guard: a push releases only when it changes something that is
    # shipped, which is the package source and its metadata. A push that touches
    # only docs, README, tests, the Claude Code plugin, research files or CI
    # config is skipped entirely, so it produces no version, tag or upload.
    paths:
      - 'src/**'
      - 'pyproject.toml'

# Two pushes in quick succession must not race for the same version and tag.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '6.x'

      - name: Debug GitVersion
        run: |
          echo "Git tags:"
          git tag -l
          echo "Current commit:"
          git log --oneline -5
          echo "GitVersion config:"
          cat GitVersion.yml

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true

      - name: Display GitVersion outputs
        run: |
          echo "SemVer:          ${{ steps.gitversion.outputs.semVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "PreReleaseTag:   ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "BranchName:      ${{ steps.gitversion.outputs.branchName }}"
          echo "CommitsSince:    ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"

  build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Update version in pyproject.toml
        # Anchored to the start of the line: [tool.ruff] and [tool.mypy] have keys that end in "version" too.
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' pyproject.toml
          grep -n '^version' pyproject.toml

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Install the wheel in a clean environment and start the server
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          python tools/smoke_test.py /tmp/smoke/bin/routeros-lsp --expect-version "${{ needs.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  publish:
    runs-on: ubuntu-latest
    needs: [version, build, test]
    environment:
      name: pypi
      url: https://pypi.org/p/routeros-lsp
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        # skip-existing: true means a duplicate version is silently skipped
        # instead of failing the pipeline with a 400 error.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true

  create-release:
    runs-on: ubuntu-latest
    needs: [version, publish]
    # Only after the package is on PyPI (a skipped duplicate counts as success). A tag for a version that never reached
    # PyPI would make the next run skip to the following number and leave a hole in the release history.
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use majorMinorPatch (e.g. v0.2.0), not semVer. A stable tag is required so that GitVersion treats it as the
          # version source on the next run and increments from it on the next feat: or fix: commit.
          TAG="v${{ needs.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## routeros-lsp v${{ needs.version.outputs.version }}

            Install: `pipx install routeros-lsp` or `uv tool install routeros-lsp`

            **PyPI:** https://pypi.org/project/routeros-lsp/${{ needs.version.outputs.version }}/
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
