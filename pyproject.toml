[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routeros-lsp"
# Placeholder only: the real version is computed by GitVersion and injected into this line by CI at release time.
version = "0.0.0"
description = "Language server for MikroTik RouterOS scripts (.rsc)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "WireSage", email = "sir.jeff.nasseri@gmail.com"}
]
keywords = ["routeros", "mikrotik", "rsc", "lsp", "language-server"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build", "twine"]

[project.urls]
Homepage = "https://github.com/wiresage/routeros-lsp"
Issues = "https://github.com/wiresage/routeros-lsp/issues"
Repository = "https://github.com/wiresage/routeros-lsp"

[project.scripts]
routeros-lsp = "routeros_lsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routeros_lsp = ["data/*.json.gz", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:asyncio"

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]
# measurement scripts for a router, not part of the package
extend-exclude = ["research", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
